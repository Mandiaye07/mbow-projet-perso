<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Écurie</title>
    <style> * {             /*Une partie du css a été rédigé avec l'IA */
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background-image: url("static/Background3.jpg"); 
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: #f0f0f0;
    }

    h1 {
        font-size: 2.5em;
        color: #FFD700;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        margin-bottom: 20px;
    }

    a[href="/"] {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #FFD700;
        font-size: 1.1em;
        text-decoration: none;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 8px 15px;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }

    a[href="/"]:hover {
        background-color: #ff4500;
    }

    form {
        background-color: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        font-size: 1em;
        color: #FFD700;
    }

    input[type="text"],
    input[type="date"] {
        padding: 10px;
        border: none;
        border-radius: 5px;
        width: 100%;
    }

    input[type="submit"] {
        background-color: #ff4500;
        color: #fff;
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
        background-color: #FFD700;
    }

    @media (max-width: 768px) {
        form {
            width: 90%;
        }

        a[href="/"] {
            font-size: 1em;
        }
    }
    </style>
</head>
<body>
    <h1>Modifier une Écurie</h1>
    <form action="/modifier_ecurie" method="POST">
        <label for="id_ecurie">Choisir l'écurie à modifier :</label>
        <select id="id_ecurie" name="id_ecurie" required>
            {% for ecurie in data %}
                <option value="{{ ecurie[0] }}">{{ ecurie[1] }}</option>
            {% endfor %}
        </select><br>

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required><br>

        <label for="nationalité">Nationalité :</label>
        <input type="text" id="nationalité" name="nationalité" required><br>

        <label for="date_creation">Date de Création :</label>
        <input type="number" id="date_creation" name="date_creation" required><br>

        <input type="submit" value="Modifier">
    </form>
    <a href="/">Retour</a>
</body>
</html>
