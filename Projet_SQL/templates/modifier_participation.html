<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un résultat</title>
    <style>         /*Une partie du css a été rédigé avec l'IA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url("static/Background3.jpg"); 
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #f0f0f0;
        }

        h1 {
            font-size: 2.5em;
            color: #FFD700;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        a[href="/"] {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FFD700;
            font-size: 1.1em;
            text-decoration: none;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a[href="/"]:hover {
            background-color: #ff4500;
        }

        form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 1em;
            color: #FFD700;
        }

        input[type="text"],
        input[type="date"] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 100%;
        }

        input[type="submit"] {
            background-color: #ff4500;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #FFD700;
        }

        @media (max-width: 768px) {
            form {
                width: 90%;
            }

            a[href="/"] {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <h1>Modifier un résultat</h1> 

    <form method="POST"> 
        <label for="participation_id">Sélectionnez la participation à modifier :</label> 
        <select id="participation_id" name="participation_id" required> <!-- Sélecteur pour choisir une participation -->
            {% for participation in participations %} <!-- Boucle pour afficher chaque participation -->
                <option value="{{ participation[0] }}"> <!-- Valeur de l'option est l'ID de participation -->
                    Pilote : {{ participation[1] }} {{ participation[2] }} - GP : {{ participation[3] }} <!-- Affiche le nom du pilote et le Grand Prix -->
                </option>
            {% endfor %}
        </select><br><br>

        <label for="id_pilote">Pilote :</label> 
        <select id="id_pilote" name="id_pilote" required> <!-- Sélecteur pour choisir un pilote -->
            {% for pilote in pilotes %} <!-- Boucle pour afficher chaque pilote -->
                <option value="{{ pilote[0] }}">{{ pilote[1] }} {{ pilote[2] }}</option> <!-- Affiche le nom et le prénom du pilote -->
            {% endfor %}
        </select><br><br>

        <label for="id_gp">Grand Prix :</label> 
        <select id="id_gp" name="id_gp" required> <!-- Sélecteur pour choisir un Grand Prix -->
            {% for gp in gps %} <!-- Boucle pour afficher chaque Grand Prix -->
                <option value="{{ gp[0] }}">{{ gp[1] }}</option> 
            {% endfor %}
        </select><br><br>

        <label for="temps">Temps :</label> 
        <input type="text" id="temps" name="temps" required><br><br> <!-- Champ de texte pour entrer le temps -->

        <label for="position">Position :</label>
        <input type="text" id="position" name="position" required><br><br> <!-- Champ de texte pour entrer la position -->

        <input type="submit" value="Modifier"> 
    </form>
    <a href="/">Retour</a>
</body>
</html>
